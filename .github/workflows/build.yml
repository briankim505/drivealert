name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_PASSWORD secret missing - APK will be unsigned (compile check only)"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: List Kakao SDK classes (for debugging)
        if: always()
        run: |
          AAR=$(find ~/.gradle/caches -name 'knsdk_ui*.aar' | head -1)
          echo "AAR: $AAR"
          (for a in $(find ~/.gradle/caches -name 'knsdk*.aar'); do
            mkdir -p /tmp/k && unzip -o -q "$a" classes.jar -d /tmp/k && \
            unzip -l /tmp/k/classes.jar | awk '{print $4}' | grep -E '/KN(SDK|Guidance|Guide_|Safety|NaviView|Error|LanguageType|Route(Priority|AvoidOption)|MultiRouteInfo|Route)[A-Za-z_]*\.class$' | grep -v '\$' | sort -u
            mkdir -p /tmp/kc && cd /tmp/kc && unzip -o -q /tmp/k/classes.jar && cd - >/dev/null
          done) > classes.txt 2>&1 || true
          # 주요 인터페이스 메서드 시그니처
          for c in $(grep -E 'KNGuidance_[A-Za-z]+Delegate|ui/view/KNNaviView|/KNSDK.class' classes.txt) \
            $(cd /tmp/kc && find . -name 'KNGuidance.class' -o -name 'KNGuideFrequ*.class' -o -name 'KNGuide_Voice.class' -o -name 'KNVoiceCode.class' -o -name 'KNSafetyCode.class' -o -name 'KNSafety_Camera.class' -o -name 'KNSafety_Section.class' -o -name 'KNSafety.class' -o -name 'KNSpeedOverAlertOption.class' -o -name 'KNGuide_Location.class' -o -name 'KNGPSData.class' -o -name 'KNSoundPlayer*.class' | sed 's#^\./##'); do
            javap -cp /tmp/kc "${c%.class}" 2>/dev/null
          done > signatures.txt || true

      - name: Save build report
        if: always()
        run: |
          mkdir -p /tmp/report && cp build.log classes.txt signatures.txt /tmp/report/ 2>/dev/null || true
          grep -E '^e: |error:|What went wrong|Could not' build.log | head -100 > /tmp/report/errors.txt || true
          cd /tmp/report && git init -q -b build-report && git add -A && \
            git -c user.name=ci -c user.email=ci@local commit -q -m "report ${{ github.run_number }}" && \
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-report

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveAlert-1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: env.KEYSTORE_PATH != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DriveAlert-1.0.${{ github.run_number }}.apk"
          gh release create "v1.0.${{ github.run_number }}" "DriveAlert-1.0.${{ github.run_number }}.apk" \
            --title "드라이브 알리미 1.0.${{ github.run_number }}" --notes "자동 빌드"
        env:
          GH_TOKEN: ${{ github.token }}
